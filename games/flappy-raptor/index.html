<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Raptor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #08101a; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  #wrap { position: relative; width: 100%; height: 100%; max-width: 480px; max-height: 680px; aspect-ratio: 480/680; background: #4fc3f7; border: 1px solid #1a3248; box-shadow: 0 0 25px rgba(0,212,255,0.2); }
  canvas { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-weight: 800; font-size: 1.1rem; pointer-events: none; z-index: 10; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
  .sc { color: #fff; }
  .hs { color: #ffd600; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hud">
    <div class="sc">SCORE: <span id="sc">0</span></div>
    <div class="hs">BEST: <span id="hs">0</span></div>
  </div>
  <canvas id="c" width="480" height="680"></canvas>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scEl = document.getElementById('sc'), hsEl = document.getElementById('hs');
const GAME_ID = 'flappy-raptor';
let highScore = parseInt(localStorage.getItem('raptor_hs_' + GAME_ID) || '0', 10);
hsEl.textContent = highScore;

let actx = null;
function snd(type) {
  try {
    if (localStorage.getItem('raptor_muted') === 'true') return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const osc = actx.createOscillator(), g = actx.createGain();
    if (type === 'flap') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(250, t); osc.frequency.linearRampToValueAtTime(450, t + 0.08);
      g.gain.setValueAtTime(0.08, t); g.gain.linearRampToValueAtTime(0, t + 0.08);
      osc.connect(g); g.connect(actx.destination); osc.start(t); osc.stop(t + 0.08);
    } else if (type === 'score') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(700, t); osc.frequency.setValueAtTime(1000, t + 0.06);
      g.gain.setValueAtTime(0.08, t); g.gain.linearRampToValueAtTime(0, t + 0.12);
      osc.connect(g); g.connect(actx.destination); osc.start(t); osc.stop(t + 0.12);
    } else if (type === 'hit') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, t); osc.frequency.linearRampToValueAtTime(40, t + 0.25);
      g.gain.setValueAtTime(0.15, t); g.gain.linearRampToValueAtTime(0, t + 0.25);
      osc.connect(g); g.connect(actx.destination); osc.start(t); osc.stop(t + 0.25);
    }
  } catch(e){}
}

const bird = { x: 90, y: 300, vy: 0, gravity: 0.52, jump: -8.8, tilt: 0 };
let pipes = [], score = 0, state = 'start', pipeTimer = 0;

function flap() {
  if (state === 'start' || state === 'over') {
    resetGame();
  } else {
    bird.vy = bird.jump;
    snd('flap');
  }
}

function resetGame() {
  bird.y = 300; bird.vy = 0; bird.tilt = 0;
  pipes = []; score = 0; pipeTimer = 0;
  scEl.textContent = '0';
  state = 'play';
}

window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); flap(); }
  if (e.code === 'KeyR') resetGame();
});
cv.addEventListener('click', flap);
cv.addEventListener('touchstart', e => { e.preventDefault(); flap(); });

function update() {
  if (state !== 'play') return;

  bird.vy += bird.gravity;
  bird.y += bird.vy;
  bird.tilt = Math.min(Math.PI / 4, Math.max(-Math.PI / 5, bird.vy * 0.06));

  // Floor / Ceiling hit
  if (bird.y >= 610) { bird.y = 610; gameOver(); }
  if (bird.y <= 15) { bird.y = 15; bird.vy = 0; }

  // Pipes
  pipeTimer++;
  if (pipeTimer >= 95) {
    pipeTimer = 0;
    const gap = 145;
    const topH = Math.floor(Math.random() * 260 + 60);
    pipes.push({ x: 500, topH, gap, passed: false });
  }

  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= 3.2;

    // Check pass score
    if (!p.passed && p.x + 55 < bird.x) {
      p.passed = true;
      score++;
      scEl.textContent = score;
      snd('score');
    }

    // Collision check
    const bx = bird.x, by = bird.y, br = 14;
    if (bx + br > p.x && bx - br < p.x + 55) {
      if (by - br < p.topH || by + br > p.topH + p.gap) {
        gameOver();
      }
    }

    if (p.x < -80) pipes.splice(i, 1);
  }
}

function gameOver() {
  state = 'over';
  snd('hit');
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('raptor_hs_' + GAME_ID, highScore);
    hsEl.textContent = highScore;
    try { if (window.parent && window.parent.onHighScoreUpdate) window.parent.onHighScoreUpdate(GAME_ID, highScore); } catch(e){}
  }
}

function draw() {
  // Sky
  const grad = ctx.createLinearGradient(0, 0, 0, 680);
  grad.addColorStop(0, '#4fc3f7'); grad.addColorStop(0.7, '#b3e5fc'); grad.addColorStop(1, '#e1f5fe');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 480, 680);

  // Basalt Pillars (Pipes)
  pipes.forEach(p => {
    ctx.fillStyle = '#37474f';
    // Top pipe
    ctx.fillRect(p.x, 0, 55, p.topH);
    ctx.fillStyle = '#455a64';
    ctx.fillRect(p.x - 4, p.topH - 20, 63, 20);
    // Bottom pipe
    ctx.fillStyle = '#37474f';
    ctx.fillRect(p.x, p.topH + p.gap, 55, 680 - (p.topH + p.gap));
    ctx.fillStyle = '#455a64';
    ctx.fillRect(p.x - 4, p.topH + p.gap, 63, 20);
  });

  // Ground
  ctx.fillStyle = '#5d4037';
  ctx.fillRect(0, 620, 480, 60);
  ctx.fillStyle = '#7cb342';
  ctx.fillRect(0, 620, 480, 10);

  // Baby Raptor
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.tilt);
  // Wings
  ctx.fillStyle = '#ff5722';
  ctx.beginPath(); ctx.ellipse(-6, -4, 12, 6, -0.3, 0, Math.PI * 2); ctx.fill();
  // Body
  ctx.fillStyle = '#ff9800';
  ctx.beginPath(); ctx.ellipse(4, 2, 16, 12, 0, 0, Math.PI * 2); ctx.fill();
  // Head & Beak
  ctx.beginPath(); ctx.arc(14, -4, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d84315';
  ctx.beginPath(); ctx.moveTo(22, -6); ctx.lineTo(32, -3); ctx.lineTo(22, 2); ctx.fill();
  // Eye
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(16, -6, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(17, -6, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // Overlays
  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, 480, 680);
    ctx.fillStyle = '#fff'; ctx.font = '900 36px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('FLAPPY RAPTOR', 240, 290);
    ctx.fillStyle = '#ffd600'; ctx.font = '700 18px system-ui';
    ctx.fillText('TAP OR PRESS SPACE TO FLY', 240, 335);
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, 480, 680);
    ctx.fillStyle = '#ff1744'; ctx.font = '900 40px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('CRASH LANDING', 240, 270);
    ctx.fillStyle = '#fff'; ctx.font = '700 22px system-ui';
    ctx.fillText('SCORE: ' + score, 240, 320);
    ctx.fillStyle = '#ffd600'; ctx.font = '600 18px system-ui';
    ctx.fillText('BEST: ' + highScore, 240, 355);
    ctx.fillStyle = '#00e5ff'; ctx.font = '600 16px system-ui';
    ctx.fillText('CLICK OR TAP TO RETRY', 240, 410);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('message', e => {
  if (e.data === 'restart') resetGame();
});
</script>
</body>
</html>
