<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Connect Four</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0b111e; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  #wrap { position: relative; width: 100%; height: 100%; max-width: 600px; max-height: 580px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; }
  .header { display: flex; justify-content: space-between; width: 100%; max-width: 500px; font-weight: 800; font-size: 1rem; }
  .status { font-size: 1.15rem; font-weight: 800; color: #ffd600; text-align: center; }
  .board { position: relative; width: 100%; max-width: 500px; aspect-ratio: 7/6; background: #1565c0; border-radius: 12px; padding: 10px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; box-shadow: 0 12px 30px rgba(0,0,0,0.7); cursor: pointer; }
  .col-trigger { position: absolute; top: 0; bottom: 0; z-index: 10; cursor: pointer; }
  .cell { background: #0b111e; border-radius: 50%; width: 100%; height: 100%; box-shadow: inset 0 3px 6px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; }
  .chip { width: 90%; height: 90%; border-radius: 50%; }
  .c-red { background: radial-gradient(circle at 35% 35%, #ff5252, #b71c1c); box-shadow: 0 2px 8px rgba(255,23,68,0.5); }
  .c-yellow { background: radial-gradient(circle at 35% 35%, #fff176, #f57f17); box-shadow: 0 2px 8px rgba(255,214,0,0.5); }
  .win-line { border: 3px solid #fff; }
  .toolbar { display: flex; gap: 10px; }
  .btn { background: #1e88e5; color: #fff; font-weight: 800; font-size: 0.8rem; padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; }
  .btn.active { background: #ff5252; }
</style>
</head>
<body>
<div id="wrap">
  <div class="header">
    <div style="color: #ff5252;">RED (P1): <span id="s-red">0</span></div>
    <div class="toolbar">
      <button class="btn active" id="mode-cpu" onclick="setMode('cpu')">VS CPU</button>
      <button class="btn" id="mode-2p" onclick="setMode('2p')">2 PLAYER</button>
      <button class="btn" onclick="restart()" style="background: #37474f;">RESET</button>
    </div>
    <div style="color: #ffd600;">YELLOW (AI): <span id="s-yel">0</span></div>
  </div>
  <div class="status" id="status">RED'S TURN TO DROP</div>
  <div class="board" id="board"></div>
</div>

<script>
const boardEl = document.getElementById('board'), statusEl = document.getElementById('status');
const sRedEl = document.getElementById('s-red'), sYelEl = document.getElementById('s-yel');
const GAME_ID = 'connect-four';

const COLS = 7, ROWS = 6;
let grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
let turn = 1; // 1 = Red, 2 = Yellow
let mode = 'cpu'; // 'cpu' or '2p'
let winsRed = 0, winsYel = 0, state = 'play';

function setMode(m) {
  mode = m;
  document.getElementById('mode-cpu').classList.toggle('active', m === 'cpu');
  document.getElementById('mode-2p').classList.toggle('active', m === '2p');
  restart();
}

function initBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      boardEl.appendChild(cell);
    }
  }
  for (let c = 0; c < COLS; c++) {
    const trigger = document.createElement('div');
    trigger.className = 'col-trigger';
    trigger.style.left = (c * (100 / 7)) + '%';
    trigger.style.width = (100 / 7) + '%';
    trigger.onclick = () => dropToken(c);
    boardEl.appendChild(trigger);
  }
}

function restart() {
  grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(0));
  turn = 1; state = 'play';
  statusEl.textContent = "RED'S TURN TO DROP";
  statusEl.style.color = '#ff5252';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = document.getElementById(`cell-${r}-${c}`);
      if (el) el.innerHTML = '';
    }
  }
}

function dropToken(col) {
  if (state !== 'play') return;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (grid[r][col] === 0) {
      grid[r][col] = turn;
      const cell = document.getElementById(`cell-${r}-${c}`);
      const chip = document.createElement('div');
      chip.className = 'chip ' + (turn === 1 ? 'c-red' : 'c-yellow');
      document.getElementById(`cell-${r}-${col}`).appendChild(chip);

      const win = checkWin(r, col, turn);
      if (win) {
        state = 'over';
        statusEl.textContent = (turn === 1 ? 'RED WINS!' : 'YELLOW WINS!');
        statusEl.style.color = turn === 1 ? '#ff5252' : '#ffd600';
        if (turn === 1) { winsRed++; sRedEl.textContent = winsRed; }
        else { winsYel++; sYelEl.textContent = winsYel; }
        try {
          const hs = parseInt(localStorage.getItem('raptor_hs_' + GAME_ID) || '0', 10);
          if (winsRed > hs) {
            localStorage.setItem('raptor_hs_' + GAME_ID, winsRed);
            if (window.parent && window.parent.onHighScoreUpdate) window.parent.onHighScoreUpdate(GAME_ID, winsRed);
          }
        } catch(e){}
        return;
      }

      // Check Draw
      if (grid[0].every(v => v !== 0)) {
        state = 'over';
        statusEl.textContent = "DRAW GAME!";
        return;
      }

      turn = turn === 1 ? 2 : 1;
      statusEl.textContent = (turn === 1 ? "RED'S TURN" : "YELLOW'S TURN");
      statusEl.style.color = turn === 1 ? '#ff5252' : '#ffd600';

      if (turn === 2 && mode === 'cpu') {
        setTimeout(cpuMove, 350);
      }
      return;
    }
  }
}

function checkWin(r, c, p) {
  function count(dr, dc) {
    let cnt = 0, nr = r + dr, nc = c + dc;
    while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === p) {
      cnt++; nr += dr; nc += dc;
    }
    return cnt;
  }
  if (count(0, -1) + count(0, 1) >= 3) return true; // Horizontal
  if (count(-1, 0) + count(1, 0) >= 3) return true; // Vertical
  if (count(-1, -1) + count(1, 1) >= 3) return true; // Diag 1
  if (count(-1, 1) + count(1, -1) >= 3) return true; // Diag 2
  return false;
}

function cpuMove() {
  if (state !== 'play') return;
  // 1. Can CPU win right now?
  for (let c = 0; c < COLS; c++) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c] === 0) {
        grid[r][c] = 2;
        if (checkWin(r, c, 2)) { grid[r][c] = 0; dropToken(c); return; }
        grid[r][c] = 0;
        break;
      }
    }
  }
  // 2. Can player win next? Block them!
  for (let c = 0; c < COLS; c++) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c] === 0) {
        grid[r][c] = 1;
        if (checkWin(r, c, 1)) { grid[r][c] = 0; dropToken(c); return; }
        grid[r][c] = 0;
        break;
      }
    }
  }
  // 3. Center preference / random legal col
  const centerPref = [3, 2, 4, 1, 5, 0, 6];
  for (let c of centerPref) {
    if (grid[0][c] === 0) { dropToken(c); return; }
  }
}

initBoard();
restart();

window.addEventListener('message', e => {
  if (e.data === 'restart') restart();
});
</script>
</body>
</html>
