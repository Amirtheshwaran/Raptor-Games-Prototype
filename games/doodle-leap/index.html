<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Doodle Leap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0c1824; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  #wrap { position: relative; width: 100%; height: 100%; max-width: 480px; max-height: 680px; aspect-ratio: 480/680; background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364); border: 1px solid #1a3c4f; box-shadow: 0 0 25px rgba(118,255,3,0.2); }
  canvas { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-weight: 800; font-size: 1.1rem; pointer-events: none; z-index: 10; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .sc { color: #76ff03; }
  .hs { color: #ffd600; }
</style>
</head>
<body>
<div id="wrap">
  <div class="hud">
    <div class="sc">ALTITUDE: <span id="sc">0</span></div>
    <div class="hs">RECORD: <span id="hs">0</span></div>
  </div>
  <canvas id="c" width="480" height="680"></canvas>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scEl = document.getElementById('sc'), hsEl = document.getElementById('hs');
const GAME_ID = 'doodle-leap';
let highScore = parseInt(localStorage.getItem('raptor_hs_' + GAME_ID) || '0', 10);
hsEl.textContent = highScore;

let actx = null;
function snd(type) {
  try {
    if (localStorage.getItem('raptor_muted') === 'true') return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const osc = actx.createOscillator(), g = actx.createGain();
    if (type === 'jump') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(260, t); osc.frequency.linearRampToValueAtTime(580, t + 0.1);
      g.gain.setValueAtTime(0.08, t); g.gain.linearRampToValueAtTime(0, t + 0.1);
      osc.connect(g); g.connect(actx.destination); osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'spring') {
      osc.type = 'sine'; osc.frequency.setValueAtTime(350, t); osc.frequency.exponentialRampToValueAtTime(950, t + 0.2);
      g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0, t + 0.2);
      osc.connect(g); g.connect(actx.destination); osc.start(t); osc.stop(t + 0.2);
    }
  } catch(e){}
}

const p = { x: 220, y: 500, vx: 0, vy: 0, w: 32, h: 32 };
let platforms = [], score = 0, state = 'start', maxAlt = 0;

function resetGame() {
  p.x = 220; p.y = 500; p.vx = 0; p.vy = -12;
  platforms = [{ x: 200, y: 600, w: 80, type: 'normal' }];
  for (let y = 500; y > 0; y -= 65) {
    platforms.push({
      x: Math.random() * 380 + 20, y, w: 75,
      type: Math.random() > 0.85 ? 'spring' : Math.random() > 0.75 ? 'move' : 'normal',
      dir: Math.random() > 0.5 ? 1 : -1
    });
  }
  score = 0; maxAlt = 0; scEl.textContent = '0';
  state = 'play';
}

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'KeyW'].includes(e.code) && state !== 'play') resetGame();
  if (e.code === 'KeyR') resetGame();
});
window.addEventListener('keyup', e => keys[e.code] = false);

cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  p.x = (e.clientX - rect.left) * (480 / rect.width) - p.w / 2;
});
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  p.x = (e.touches[0].clientX - rect.left) * (480 / rect.width) - p.w / 2;
});
cv.addEventListener('click', () => { if (state !== 'play') resetGame(); });

function update() {
  if (state !== 'play') return;

  if (keys['ArrowLeft'] || keys['KeyA']) p.x -= 6.5;
  if (keys['ArrowRight'] || keys['KeyD']) p.x += 6.5;

  // Screen wrap
  if (p.x < -20) p.x = 480; else if (p.x > 480) p.x = -20;

  // Physics
  p.vy += 0.42; // Gravity
  p.y += p.vy;

  // Camera scroll when above middle
  if (p.y < 340) {
    const diff = 340 - p.y;
    p.y = 340;
    maxAlt += Math.floor(diff);
    score = Math.floor(maxAlt / 10);
    scEl.textContent = score;

    platforms.forEach(pl => pl.y += diff);
  }

  // Bounce on platforms when falling down
  if (p.vy > 0) {
    platforms.forEach(pl => {
      if (p.x + p.w > pl.x && p.x < pl.x + pl.w && p.y + p.h >= pl.y && p.y + p.h <= pl.y + 16) {
        if (pl.type === 'spring') {
          p.vy = -18;
          snd('spring');
        } else {
          p.vy = -11.5;
          snd('jump');
        }
      }
    });
  }

  // Update platforms
  platforms.forEach(pl => {
    if (pl.type === 'move') {
      pl.x += pl.dir * 2;
      if (pl.x < 10) { pl.x = 10; pl.dir = 1; }
      else if (pl.x + pl.w > 470) { pl.x = 470 - pl.w; pl.dir = -1; }
    }
  });

  // Recycle platforms
  for (let i = platforms.length - 1; i >= 0; i--) {
    if (platforms[i].y > 690) {
      platforms.splice(i, 1);
      const topPl = platforms[platforms.length - 1];
      platforms.push({
        x: Math.random() * 380 + 20,
        y: topPl.y - (Math.random() * 25 + 60),
        w: 75,
        type: Math.random() > 0.85 ? 'spring' : Math.random() > 0.75 ? 'move' : 'normal',
        dir: Math.random() > 0.5 ? 1 : -1
      });
    }
  }

  // Pit death
  if (p.y > 700) {
    state = 'over';
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('raptor_hs_' + GAME_ID, highScore);
      hsEl.textContent = highScore;
      try { if (window.parent && window.parent.onHighScoreUpdate) window.parent.onHighScoreUpdate(GAME_ID, highScore); } catch(e){}
    }
  }
}

function draw() {
  ctx.fillStyle = '#0f2027';
  ctx.fillRect(0, 0, 480, 680);

  // Platforms
  platforms.forEach(pl => {
    ctx.fillStyle = pl.type === 'spring' ? '#ffd600' : pl.type === 'move' ? '#00e5ff' : '#76ff03';
    ctx.beginPath();
    ctx.roundRect(pl.x, pl.y, pl.w, 14, 7);
    ctx.fill();
    if (pl.type === 'spring') {
      ctx.fillStyle = '#ff1744';
      ctx.fillRect(pl.x + pl.w / 2 - 6, pl.y - 6, 12, 6);
    }
  });

  // Character
  ctx.fillStyle = '#76ff03';
  ctx.beginPath();
  ctx.arc(p.x + p.w / 2, p.y + p.h / 2, 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(p.x + p.w / 2 + 5, p.y + p.h / 2 - 3, 3, 0, Math.PI * 2); ctx.fill();

  // Overlays
  if (state === 'start') {
    ctx.fillStyle = 'rgba(15, 32, 39, 0.85)';
    ctx.fillRect(0, 0, 480, 680);
    ctx.fillStyle = '#76ff03'; ctx.font = '900 36px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('DOODLE LEAP', 240, 290);
    ctx.fillStyle = '#fff'; ctx.font = '600 16px system-ui';
    ctx.fillText('PRESS SPACE OR TAP TO JUMP', 240, 335);
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(15, 32, 39, 0.9)';
    ctx.fillRect(0, 0, 480, 680);
    ctx.fillStyle = '#ff1744'; ctx.font = '900 38px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('FALLEN FROM SKY', 240, 270);
    ctx.fillStyle = '#fff'; ctx.font = '700 22px system-ui';
    ctx.fillText('ALTITUDE: ' + score, 240, 320);
    ctx.fillStyle = '#ffd600'; ctx.font = '600 18px system-ui';
    ctx.fillText('RECORD: ' + highScore, 240, 355);
    ctx.fillStyle = '#00e5ff'; ctx.font = '600 16px system-ui';
    ctx.fillText('CLICK TO LEAP AGAIN', 240, 410);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('message', e => {
  if (e.data === 'restart') resetGame();
});
</script>
</body>
</html>
