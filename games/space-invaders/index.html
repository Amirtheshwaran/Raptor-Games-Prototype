<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Invaders</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #040711; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  #wrap { position: relative; width: 100%; height: 100%; max-width: 640px; max-height: 640px; aspect-ratio: 1/1; background: #060a16; border: 1px solid #1a2a44; box-shadow: 0 0 25px rgba(0,229,255,0.15); }
  canvas { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-weight: 800; font-size: 0.95rem; letter-spacing: 1px; pointer-events: none; z-index: 10; }
  .hud-lives { color: #76ff03; }
  .hud-score { color: #00e5ff; }
  .hud-hs { color: #ffd600; }
  .touch-bar { position: absolute; bottom: 12px; left: 12px; right: 12px; display: none; justify-content: space-between; z-index: 20; }
  .tbtn { width: 60px; height: 48px; border-radius: 8px; background: rgba(16,32,56,0.85); border: 1px solid #00e5ff; color: #fff; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
  @media(max-width: 600px){ .touch-bar { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <div class="hud">
    <div class="hud-score">SCORE: <span id="sc">0</span></div>
    <div class="hud-lives">LIVES: <span id="lv">❤❤❤</span></div>
    <div class="hud-hs">BEST: <span id="hs">0</span></div>
  </div>
  <canvas id="c" width="640" height="640"></canvas>
  <div class="touch-bar">
    <button class="tbtn" id="t-left">←</button>
    <button class="tbtn" id="t-fire" style="width: 120px; background: #00e5ff; color:#000;">FIRE</button>
    <button class="tbtn" id="t-right">→</button>
  </div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scEl = document.getElementById('sc'), lvEl = document.getElementById('lv'), hsEl = document.getElementById('hs');
const GAME_ID = 'space-invaders';
let highScore = parseInt(localStorage.getItem('raptor_hs_' + GAME_ID) || '0', 10);
hsEl.textContent = highScore;

// Audio
let actx = null;
function snd(type) {
  try {
    if (localStorage.getItem('raptor_muted') === 'true') return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const osc = actx.createOscillator(), g = actx.createGain();
    if (type === 'laser') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
      g.gain.setValueAtTime(0.08, t); g.gain.linearRampToValueAtTime(0, t + 0.1);
      osc.connect(g); g.connect(actx.destination); osc.start(t); osc.stop(t + 0.1);
    } else if (type === 'alien-hit') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(200, t); osc.frequency.linearRampToValueAtTime(60, t + 0.12);
      g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0, t + 0.12);
      osc.connect(g); g.connect(actx.destination); osc.start(t); osc.stop(t + 0.12);
    } else if (type === 'player-hit') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, t); osc.frequency.linearRampToValueAtTime(40, t + 0.3);
      g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0, t + 0.3);
      osc.connect(g); g.connect(actx.destination); osc.start(t); osc.stop(t + 0.3);
    }
  } catch(e){}
}

let player = { x: 300, y: 580, w: 40, h: 22, speed: 6 };
let lasers = [], enemyLasers = [], invaders = [], particles = [], bunkers = [];
let ufo = null, ufoTimer = 400;
let score = 0, lives = 3, state = 'start', wave = 1;
let invaderDir = 1, invaderStepTimer = 0, invaderInterval = 30;

function initBunkers() {
  bunkers = [];
  const bX = [80, 220, 360, 500];
  bX.forEach(x => {
    let parts = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 6; c++) {
        if (!(r === 3 && (c === 2 || c === 3))) parts.push({ x: x + c * 10, y: 490 + r * 8, w: 10, h: 8, hp: 3 });
      }
    }
    bunkers.push(parts);
  });
}

function initInvaders() {
  invaders = [];
  const rows = 5, cols = 10;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let type = r === 0 ? 'squid' : r < 3 ? 'crab' : 'octopus';
      let pts = r === 0 ? 30 : r < 3 ? 20 : 10;
      let color = r === 0 ? '#ff1744' : r < 3 ? '#00e5ff' : '#00e676';
      invaders.push({ x: 80 + c * 48, y: 80 + r * 38, w: 32, h: 22, type, pts, color, alive: true });
    }
  }
  invaderDir = 1;
  invaderInterval = Math.max(10, 32 - wave * 4);
}

function resetGame() {
  player.x = 300;
  lasers = []; enemyLasers = []; particles = [];
  score = 0; lives = 3; wave = 1;
  scEl.textContent = '0';
  updateLivesDisplay();
  initBunkers();
  initInvaders();
  state = 'play';
}

function updateLivesDisplay() {
  lvEl.textContent = '❤'.repeat(Math.max(0, lives));
}

// Controls
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (state !== 'play') resetGame();
    else fireLaser();
  }
  if (e.code === 'KeyR') resetGame();
});
window.addEventListener('keyup', e => keys[e.code] = false);

cv.addEventListener('click', () => { if (state !== 'play') resetGame(); });

// Mobile controls
let touchLeft = false, touchRight = false;
document.getElementById('t-left').addEventListener('touchstart', e => { e.preventDefault(); touchLeft = true; });
document.getElementById('t-left').addEventListener('touchend', e => { e.preventDefault(); touchLeft = false; });
document.getElementById('t-right').addEventListener('touchstart', e => { e.preventDefault(); touchRight = true; });
document.getElementById('t-right').addEventListener('touchend', e => { e.preventDefault(); touchRight = false; });
document.getElementById('t-fire').addEventListener('touchstart', e => { e.preventDefault(); if(state !== 'play') resetGame(); else fireLaser(); });

function fireLaser() {
  if (lasers.length < 3) {
    lasers.push({ x: player.x + player.w / 2 - 2, y: player.y - 10, w: 4, h: 12 });
    snd('laser');
  }
}

function update() {
  if (state !== 'play') return;

  // Move player
  if ((keys['ArrowLeft'] || keys['KeyA'] || touchLeft) && player.x > 10) player.x -= player.speed;
  if ((keys['ArrowRight'] || keys['KeyD'] || touchRight) && player.x < 640 - player.w - 10) player.x += player.speed;

  // Player lasers
  for (let i = lasers.length - 1; i >= 0; i--) {
    const l = lasers[i];
    l.y -= 9;
    if (l.y < -20) { lasers.splice(i, 1); continue; }

    // Hit invaders
    let hit = false;
    for (let inv of invaders) {
      if (inv.alive && l.x < inv.x + inv.w && l.x + l.w > inv.x && l.y < inv.y + inv.h && l.y + l.h > inv.y) {
        inv.alive = false;
        hit = true;
        score += inv.pts;
        scEl.textContent = score;
        snd('alien-hit');
        for (let p = 0; p < 8; p++) {
          particles.push({ x: inv.x + 16, y: inv.y + 11, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, color: inv.color, life: 1 });
        }
        break;
      }
    }
    if (hit) { lasers.splice(i, 1); continue; }

    // Hit UFO
    if (ufo && l.x < ufo.x + ufo.w && l.x + l.w > ufo.x && l.y < ufo.y + ufo.h && l.y + l.h > ufo.y) {
      score += ufo.pts;
      scEl.textContent = score;
      snd('alien-hit');
      ufo = null;
      lasers.splice(i, 1);
      continue;
    }

    // Hit Bunkers
    for (let b of bunkers) {
      for (let p of b) {
        if (p.hp > 0 && l.x < p.x + p.w && l.x + l.w > p.x && l.y < p.y + p.h && l.y + l.h > p.y) {
          p.hp--;
          hit = true;
          break;
        }
      }
      if (hit) break;
    }
    if (hit) lasers.splice(i, 1);
  }

  // UFO logic
  ufoTimer--;
  if (ufoTimer <= 0 && !ufo) {
    ufo = { x: -50, y: 45, w: 44, h: 20, speed: 2.5, pts: 200 };
    ufoTimer = Math.floor(Math.random() * 600 + 400);
  }
  if (ufo) {
    ufo.x += ufo.speed;
    if (ufo.x > 690) ufo = null;
  }

  // Invaders March
  invaderStepTimer++;
  if (invaderStepTimer >= invaderInterval) {
    invaderStepTimer = 0;
    let hitEdge = false;
    const living = invaders.filter(i => i.alive);
    if (living.length === 0) {
      wave++;
      initInvaders();
      return;
    }

    for (let inv of living) {
      if ((invaderDir === 1 && inv.x + inv.w >= 620) || (invaderDir === -1 && inv.x <= 20)) {
        hitEdge = true;
        break;
      }
    }

    if (hitEdge) {
      invaderDir *= -1;
      for (let inv of living) {
        inv.y += 18;
        if (inv.y + inv.h >= player.y - 10) {
          gameOver();
          return;
        }
      }
    } else {
      for (let inv of living) inv.x += invaderDir * 12;
    }

    // Alien random fire
    if (living.length > 0 && Math.random() < 0.65) {
      const shooter = living[Math.floor(Math.random() * living.length)];
      enemyLasers.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, w: 3, h: 10 });
    }
  }

  // Enemy Lasers
  for (let i = enemyLasers.length - 1; i >= 0; i--) {
    const el = enemyLasers[i];
    el.y += 5;
    if (el.y > 660) { enemyLasers.splice(i, 1); continue; }

    // Hit player
    if (el.x < player.x + player.w && el.x + el.w > player.x && el.y < player.y + player.h && el.y + el.h > player.y) {
      snd('player-hit');
      lives--;
      updateLivesDisplay();
      enemyLasers.splice(i, 1);
      for (let p = 0; p < 15; p++) {
        particles.push({ x: player.x + 20, y: player.y + 10, vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7, color: '#76ff03', life: 1 });
      }
      if (lives <= 0) gameOver();
      continue;
    }

    // Hit bunkers
    let hit = false;
    for (let b of bunkers) {
      for (let p of b) {
        if (p.hp > 0 && el.x < p.x + p.w && el.x + el.w > p.x && el.y < p.y + p.h && el.y + el.h > p.y) {
          p.hp--;
          hit = true;
          break;
        }
      }
      if (hit) break;
    }
    if (hit) enemyLasers.splice(i, 1);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.04;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function gameOver() {
  state = 'over';
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('raptor_hs_' + GAME_ID, highScore);
    hsEl.textContent = highScore;
    try { if (window.parent && window.parent.onHighScoreUpdate) window.parent.onHighScoreUpdate(GAME_ID, highScore); } catch(e){}
  }
}

function draw() {
  ctx.fillStyle = '#060a16';
  ctx.fillRect(0, 0, 640, 640);

  // Bunkers
  bunkers.forEach(b => {
    b.forEach(p => {
      if (p.hp > 0) {
        ctx.fillStyle = p.hp === 3 ? '#00e676' : p.hp === 2 ? '#ffeb3b' : '#ff5722';
        ctx.fillRect(p.x, p.y, p.w, p.h);
      }
    });
  });

  // UFO
  if (ufo) {
    ctx.fillStyle = '#ff1744';
    ctx.fillRect(ufo.x, ufo.y + 6, ufo.w, ufo.h - 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ufo.x + 12, ufo.y, 20, 8);
  }

  // Invaders
  invaders.forEach(inv => {
    if (inv.alive) {
      ctx.fillStyle = inv.color;
      ctx.fillRect(inv.x + 4, inv.y + 4, inv.w - 8, inv.h - 8);
      ctx.fillStyle = '#000';
      ctx.fillRect(inv.x + 8, inv.y + 8, 4, 4);
      ctx.fillRect(inv.x + inv.w - 12, inv.y + 8, 4, 4);
    }
  });

  // Player
  ctx.fillStyle = '#76ff03';
  ctx.fillRect(player.x, player.y + 10, player.w, player.h - 10);
  ctx.fillRect(player.x + player.w / 2 - 4, player.y, 8, 10);

  // Lasers
  ctx.fillStyle = '#00e5ff';
  lasers.forEach(l => ctx.fillRect(l.x, l.y, l.w, l.h));
  ctx.fillStyle = '#ff1744';
  enemyLasers.forEach(el => ctx.fillRect(el.x, el.y, el.w, el.h));

  // Particles
  particles.forEach(p => {
    ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
    ctx.fillRect(p.x, p.y, 3, 3);
  });
  ctx.globalAlpha = 1;

  // Overlays
  if (state === 'start') {
    ctx.fillStyle = 'rgba(6, 10, 22, 0.85)';
    ctx.fillRect(0, 0, 640, 640);
    ctx.fillStyle = '#00e5ff'; ctx.font = '900 36px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('SPACE INVADERS', 320, 280);
    ctx.fillStyle = '#fff'; ctx.font = '600 16px system-ui';
    ctx.fillText('PRESS SPACE OR TAP TO ENGAGE', 320, 325);
    ctx.fillStyle = '#90caf9'; ctx.font = '500 14px system-ui';
    ctx.fillText('Arrows / A,D to move | Space to Fire', 320, 360);
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(6, 10, 22, 0.9)';
    ctx.fillRect(0, 0, 640, 640);
    ctx.fillStyle = '#ff1744'; ctx.font = '900 38px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('DEFENSE COMPROMISED', 320, 260);
    ctx.fillStyle = '#fff'; ctx.font = '700 22px system-ui';
    ctx.fillText('FINAL SCORE: ' + score, 320, 310);
    ctx.fillStyle = '#ffd600'; ctx.font = '600 18px system-ui';
    ctx.fillText('BEST SCORE: ' + highScore, 320, 345);
    ctx.fillStyle = '#00e5ff'; ctx.font = '600 16px system-ui';
    ctx.fillText('PRESS SPACE TO RESTART', 320, 395);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('message', e => {
  if (e.data === 'restart') resetGame();
});
</script>
</body>
</html>
