<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Raptor Run</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #0c0810; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  #game-container { position: relative; width: 100%; height: 100%; max-width: 960px; max-height: 540px; aspect-ratio: 16/9; background: #120914; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
  canvas { width: 100%; height: 100%; display: block; }
  .hud { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; font-weight: 800; }
  .score-box { font-size: 1.3rem; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
  .hs-box { font-size: 0.95rem; color: #ffd600; }
  .combo-badge { background: #ff5722; color: #fff; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; display: none; }
  .touch-controls { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: auto; }
  .touch-zone { flex: 1; opacity: 0; }
</style>
</head>
<body>
<div id="game-container">
  <div class="hud">
    <div class="score-box">SCORE: <span id="score">0</span> <span id="combo" class="combo-badge">2X FRENZY</span></div>
    <div class="hs-box">BEST: <span id="high-score">0</span></div>
  </div>
  <canvas id="canvas" width="960" height="540"></canvas>
  <div class="touch-controls">
    <div class="touch-zone" id="touch-jump"></div>
    <div class="touch-zone" id="touch-duck"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const hsEl = document.getElementById('high-score');
const comboEl = document.getElementById('combo');

const GAME_ID = 'raptor-run';
let highScore = parseInt(localStorage.getItem('raptor_hs_' + GAME_ID) || '0', 10);
hsEl.textContent = highScore;

// Audio synth
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type) {
  try {
    initAudio();
    if (!audioCtx || localStorage.getItem('raptor_muted') === 'true') return;
    const t = audioCtx.currentTime;
    if (type === 'jump') {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(160, t); osc.frequency.exponentialRampToValueAtTime(540, t + 0.12);
      g.gain.setValueAtTime(0.08, t); g.gain.linearRampToValueAtTime(0, t + 0.12);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.12);
    } else if (type === 'pickup') {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, t); osc.frequency.setValueAtTime(1200, t + 0.08);
      g.gain.setValueAtTime(0.1, t); g.gain.linearRampToValueAtTime(0, t + 0.18);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.18);
    } else if (type === 'hit') {
      const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(40, t + 0.25);
      g.gain.setValueAtTime(0.2, t); g.gain.linearRampToValueAtTime(0, t + 0.25);
      osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.25);
    }
  } catch(e) {}
}

// Game State
let state = 'start'; // 'start', 'play', 'over'
let score = 0;
let speed = 7.5;
let baseSpeed = 7.5;
let frenzyTimer = 0;
let distance = 0;
let groundY = 440;

const raptor = {
  x: 100, y: groundY - 60, w: 54, h: 60,
  vy: 0, gravity: 0.72, jumpPower: -14.5,
  isGrounded: true, isDucking: false,
  legAngle: 0,
  reset() {
    this.x = 100; this.y = groundY - 60; this.w = 54; this.h = 60;
    this.vy = 0; this.isGrounded = true; this.isDucking = false; this.legAngle = 0;
  }
};

let obstacles = [];
let pickups = [];
let particles = [];
let spawnTimer = 0;
let pickupTimer = 0;

// Parallax Layers
let stars = [];
for (let i = 0; i < 40; i++) stars.push({ x: Math.random() * 960, y: Math.random() * 250, r: Math.random() * 1.5 + 0.5 });
let bgVolcanoes = [{ x: 0 }, { x: 480 }, { x: 960 }];
let midFerns = [{ x: 0 }, { x: 320 }, { x: 640 }, { x: 960 }];

// Controls
const keys = {};
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
    e.preventDefault();
    if (state === 'start' || state === 'over') startGame();
    else jump();
  }
  if (['ArrowDown', 'KeyS'].includes(e.code)) {
    e.preventDefault();
    raptor.isDucking = true;
  }
  if (e.code === 'KeyR') restartGame();
});

window.addEventListener('keyup', e => {
  if (['ArrowDown', 'KeyS'].includes(e.code)) {
    raptor.isDucking = false;
  }
});

// Touch controls
const jumpZone = document.getElementById('touch-jump');
const duckZone = document.getElementById('touch-duck');
jumpZone.addEventListener('touchstart', e => { e.preventDefault(); if (state !== 'play') startGame(); else jump(); });
duckZone.addEventListener('touchstart', e => { e.preventDefault(); raptor.isDucking = true; });
duckZone.addEventListener('touchend', e => { e.preventDefault(); raptor.isDucking = false; });
canvas.addEventListener('click', () => { if (state !== 'play') startGame(); });

function jump() {
  if (raptor.isGrounded && !raptor.isDucking) {
    raptor.vy = raptor.jumpPower;
    raptor.isGrounded = false;
    playSound('jump');
    addDust(raptor.x + 20, groundY, 6);
  }
}

function addDust(x, y, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.7) * 4, vy: -Math.random() * 3,
      r: Math.random() * 4 + 2, color: '#8d422a', life: 1, decay: 0.04
    });
  }
}

function addMeatParticles(x, y) {
  for (let i = 0; i < 15; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      r: Math.random() * 3 + 2, color: '#ff5722', life: 1, decay: 0.03
    });
  }
}

function startGame() {
  state = 'play';
  score = 0;
  speed = baseSpeed;
  frenzyTimer = 0;
  distance = 0;
  obstacles = [];
  pickups = [];
  particles = [];
  spawnTimer = 60;
  pickupTimer = 120;
  raptor.reset();
  scoreEl.textContent = '0';
  comboEl.style.display = 'none';
}

function restartGame() {
  startGame();
}

function reportScore() {
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('raptor_hs_' + GAME_ID, highScore);
    hsEl.textContent = highScore;
    try {
      if (window.parent && window.parent.onHighScoreUpdate) {
        window.parent.onHighScoreUpdate(GAME_ID, highScore);
      }
    } catch(e) {}
  }
}

// Main loop
function update() {
  if (state === 'play') {
    distance += speed;
    score = Math.floor(distance / 10) + (frenzyTimer > 0 ? 50 : 0);
    scoreEl.textContent = score;

    // Frenzy combo
    if (frenzyTimer > 0) {
      frenzyTimer--;
      comboEl.style.display = 'inline-block';
      speed = baseSpeed * 1.35;
    } else {
      comboEl.style.display = 'none';
      speed = baseSpeed + Math.min(6, score / 400);
    }

    // Raptor physics
    if (raptor.isDucking && raptor.isGrounded) {
      raptor.h = 36;
      raptor.y = groundY - 36;
    } else {
      raptor.h = 60;
    }

    raptor.y += raptor.vy;
    if (!raptor.isGrounded) {
      raptor.vy += raptor.gravity;
      if (raptor.y >= groundY - raptor.h) {
        raptor.y = groundY - raptor.h;
        raptor.vy = 0;
        raptor.isGrounded = true;
        addDust(raptor.x + 20, groundY, 4);
      }
    } else {
      raptor.legAngle += 0.35;
    }

    // Spawn Obstacles
    spawnTimer--;
    if (spawnTimer <= 0) {
      const isPterodactyl = Math.random() > 0.6 && score > 80;
      if (isPterodactyl) {
        // High (must duck) or low (can jump)
        const high = Math.random() > 0.4;
        obstacles.push({
          type: 'ptero',
          x: 980,
          y: high ? groundY - 85 : groundY - 50,
          w: 48, h: 32, wingAngle: 0
        });
      } else {
        const height = Math.random() > 0.5 ? 55 : 42;
        obstacles.push({
          type: 'spire',
          x: 980,
          y: groundY - height,
          w: 32, h: height
        });
      }
      spawnTimer = Math.floor(Math.random() * 40 + (80 - Math.min(35, score / 60)));
    }

    // Spawn Pickups (Meat)
    pickupTimer--;
    if (pickupTimer <= 0) {
      pickups.push({
        x: 980,
        y: groundY - (Math.random() * 90 + 30),
        w: 24, h: 24, rot: 0
      });
      pickupTimer = Math.floor(Math.random() * 120 + 160);
    }

    // Update Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed;
      if (o.type === 'ptero') o.wingAngle += 0.25;

      // Hitbox Collision
      const rx = raptor.x + 8, ry = raptor.y + 6, rw = raptor.w - 16, rh = raptor.h - 10;
      const ox = o.x + 4, oy = o.y + 4, ow = o.w - 8, oh = o.h - 8;
      if (rx < ox + ow && rx + rw > ox && ry < oy + oh && ry + rh > oy) {
        // Hit!
        state = 'over';
        playSound('hit');
        reportScore();
        addDust(raptor.x + 20, raptor.y + 30, 25);
      }
      if (o.x < -100) obstacles.splice(i, 1);
    }

    // Update Pickups
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      p.x -= speed;
      p.rot += 0.05;

      const rx = raptor.x, ry = raptor.y, rw = raptor.w, rh = raptor.h;
      if (rx < p.x + p.w && rx + rw > p.x && ry < p.y + p.h && ry + rh > p.y) {
        // Collected!
        playSound('pickup');
        addMeatParticles(p.x, p.y);
        score += 150;
        frenzyTimer = 240; // 4 seconds of frenzy
        pickups.splice(i, 1);
        continue;
      }
      if (p.x < -50) pickups.splice(i, 1);
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, 960, 540);

  // 1. Sky Gradient (Day/Dusk/Night)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, 540);
  skyGrad.addColorStop(0, '#120516');
  skyGrad.addColorStop(0.5, '#2e0e1a');
  skyGrad.addColorStop(0.85, '#6a1d1e');
  skyGrad.addColorStop(1, '#ff6728');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, 960, 540);

  // 2. Stars
  ctx.fillStyle = '#fff';
  stars.forEach(s => {
    ctx.globalAlpha = 0.5 + Math.sin(Date.now() * 0.003 + s.x) * 0.4;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // 3. Blood Moon
  ctx.fillStyle = '#ffd699';
  ctx.shadowColor = '#ff6600';
  ctx.shadowBlur = 30;
  ctx.beginPath();
  ctx.arc(800, 100, 48, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 4. Distant Volcanic Mountains (Parallax 0.1x)
  ctx.fillStyle = '#1c0710';
  const vOffset = (distance * 0.1) % 480;
  for (let i = -1; i < 3; i++) {
    const vx = i * 480 - vOffset;
    ctx.beginPath();
    ctx.moveTo(vx, groundY);
    ctx.lineTo(vx + 180, 240);
    ctx.lineTo(vx + 240, 240);
    ctx.lineTo(vx + 480, groundY);
    ctx.fill();
    // Lava glow plume
    ctx.fillStyle = '#ff7700';
    ctx.fillRect(vx + 195, 238, 30, 4);
    ctx.fillStyle = '#1c0710';
  }

  // 5. Midground Jungle Cliffs (Parallax 0.4x)
  ctx.fillStyle = '#2b0c16';
  const fOffset = (distance * 0.4) % 320;
  for (let i = -1; i < 4; i++) {
    const fx = i * 320 - fOffset;
    ctx.beginPath();
    ctx.moveTo(fx, groundY);
    ctx.lineTo(fx + 100, 360);
    ctx.lineTo(fx + 220, 370);
    ctx.lineTo(fx + 320, groundY);
    ctx.fill();
  }

  // 6. Ground Surface
  ctx.fillStyle = '#110507';
  ctx.fillRect(0, groundY, 960, 100);
  ctx.strokeStyle = frenzyTimer > 0 ? '#ff9100' : '#ff5722';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(960, groundY);
  ctx.stroke();

  // Speed lines on ground
  ctx.strokeStyle = 'rgba(255, 120, 50, 0.4)';
  ctx.lineWidth = 2;
  const gOffset = (distance * 1.2) % 120;
  for (let x = -gOffset; x < 960; x += 120) {
    ctx.beginPath();
    ctx.moveTo(x, groundY + 15);
    ctx.lineTo(x + 40, groundY + 15);
    ctx.stroke();
  }

  // 7. Pickups (Meat)
  pickups.forEach(p => {
    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    ctx.rotate(p.rot);
    // Draw meat bone & cutlet
    ctx.fillStyle = '#ff5722';
    ctx.beginPath(); ctx.arc(-2, 0, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe0b2';
    ctx.fillRect(8, -3, 14, 6);
    ctx.beginPath(); ctx.arc(22, -4, 4, 0, Math.PI * 2); ctx.arc(22, 4, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });

  // 8. Obstacles
  obstacles.forEach(o => {
    if (o.type === 'spire') {
      ctx.fillStyle = '#ff3d1f';
      ctx.beginPath();
      ctx.moveTo(o.x, groundY);
      ctx.lineTo(o.x + o.w / 2, o.y);
      ctx.lineTo(o.x + o.w, groundY);
      ctx.fill();
      ctx.strokeStyle = '#ffd600';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      // Pterodactyl
      ctx.save();
      ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
      ctx.fillStyle = '#ff1744';
      // Body
      ctx.beginPath(); ctx.ellipse(0, 0, 16, 8, 0, 0, Math.PI * 2); ctx.fill();
      // Head & Beak
      ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-26, -2); ctx.lineTo(-12, 4); ctx.fill();
      // Wings flapping
      const wY = Math.sin(o.wingAngle) * 16;
      ctx.beginPath();
      ctx.moveTo(-6, -2); ctx.lineTo(4, wY); ctx.lineTo(12, -2);
      ctx.fill();
      ctx.restore();
    }
  });

  // 9. Raptor Character
  ctx.save();
  ctx.translate(raptor.x, raptor.y);
  if (raptor.isDucking && raptor.isGrounded) {
    // Sliding / Ducking Raptor
    ctx.fillStyle = '#ff5722';
    ctx.beginPath(); ctx.ellipse(26, 20, 28, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd600';
    ctx.beginPath(); ctx.arc(48, 14, 3, 0, Math.PI * 2); ctx.fill();
    // Claws sliding
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(8, 28); ctx.lineTo(2, 34); ctx.stroke();
  } else {
    // Upright Running / Leaping Raptor
    ctx.fillStyle = frenzyTimer > 0 ? '#ffea00' : '#ff5722';
    // Body & Tail
    ctx.beginPath();
    ctx.moveTo(0, 24);
    ctx.quadraticCurveTo(15, 12, 32, 16);
    ctx.quadraticCurveTo(46, 8, 52, 2);
    ctx.lineTo(54, 10);
    ctx.quadraticCurveTo(44, 26, 30, 36);
    ctx.lineTo(8, 38);
    ctx.closePath();
    ctx.fill();

    // Head Snout & Eye
    ctx.fillStyle = frenzyTimer > 0 ? '#ff9100' : '#ff3d00';
    ctx.fillRect(40, 2, 14, 8);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(42, 5, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(43, 5, 1.2, 0, Math.PI * 2); ctx.fill();

    // Forearms / Claws
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(34, 24); ctx.lineTo(40, 28); ctx.lineTo(38, 32); ctx.stroke();

    // Animated Running Legs
    const l1 = Math.sin(raptor.legAngle) * 14;
    const l2 = Math.sin(raptor.legAngle + Math.PI) * 14;
    ctx.strokeStyle = frenzyTimer > 0 ? '#ffea00' : '#ff5722';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(22, 36); ctx.lineTo(22 + l1, 54); ctx.lineTo(28 + l1, 56); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14, 36); ctx.lineTo(14 + l2, 54); ctx.lineTo(20 + l2, 56); ctx.stroke();
  }
  ctx.restore();

  // 10. Particles
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // 11. Overlays
  if (state === 'start') {
    ctx.fillStyle = 'rgba(10, 5, 15, 0.75)';
    ctx.fillRect(0, 0, 960, 540);
    ctx.fillStyle = '#fff';
    ctx.font = '900 48px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('RAPTOR RUN', 480, 220);
    ctx.fillStyle = '#ff5722';
    ctx.font = '700 20px system-ui';
    ctx.fillText('PRESS SPACE OR TAP TO JUMP', 480, 270);
    ctx.fillStyle = '#94a3b8';
    ctx.font = '500 16px system-ui';
    ctx.fillText('Space/Up: Jump | Down: Duck | Grab Meat for 2X Frenzy', 480, 310);
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(10, 5, 15, 0.85)';
    ctx.fillRect(0, 0, 960, 540);
    ctx.fillStyle = '#ff1744';
    ctx.font = '900 46px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('EXTINCTION LEVEL EVENT', 480, 210);
    ctx.fillStyle = '#fff';
    ctx.font = '700 24px system-ui';
    ctx.fillText('FINAL SCORE: ' + score, 480, 260);
    ctx.fillStyle = '#ffd600';
    ctx.font = '700 18px system-ui';
    ctx.fillText('ALL-TIME BEST: ' + highScore, 480, 295);
    ctx.fillStyle = '#00e5ff';
    ctx.font = '600 18px system-ui';
    ctx.fillText('PRESS SPACE OR CLICK TO RETRY', 480, 345);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Listen to portal messages
window.addEventListener('message', e => {
  if (e.data === 'restart') restartGame();
  if (e.data === 'pause') {
    if (state === 'play') state = 'paused';
    else if (state === 'paused') state = 'play';
  }
});
</script>
</body>
</html>
